[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wall-e-rl"
version = "0.1.0"
description = "Reproducible RL experiments for a two-wheeled balancing robot"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.1,<2",
  "stable-baselines3>=2.7,<3",
  "tensorboard>=2.14,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["training*"]
